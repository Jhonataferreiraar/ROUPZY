name: SCA — dependências de treinamento

on:
  workflow_dispatch:
  pull_request:
    paths:
      - security-lab-sca/package.json
      - security-lab-sca/package-lock.json
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  audit-training-manifest:
    name: Auditar manifesto de treinamento
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Executar npm audit
        run: npm audit --prefix security-lab-sca --audit-level=high

      - name: Auditar manifesto principal
        run: npm audit --audit-level=high

  dependency-review:
    name: Revisar dependências alteradas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Revisar dependências do pull request
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
